# Deploys the app to the Azure Web App "smaragdus-antre" on every push to main (or by hand from the Actions tab).
# Login uses OIDC (no password stored): create the three repository secrets below from the Azure app registration
# that has a federated credential for this repository and the Contributor role on the web app.
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Reminder: on Azure every new deployment resets the game state unless the app setting KEEP_STATE=1 is set.

name: Deploy to Azure Web App - smaragdus-antre

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: deploy-smaragdus
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # required for requesting the JWT
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'smaragdus-antre'
          slot-name: 'Production'
          package: .
